name: Editorial source archive
on:
  push:
    branches: [editorial/all-posts-natural-prose-20260920]
    paths: [.github/workflows/editorial-workbench.yml]
permissions:
  contents: read
jobs:
  archive:
    if: github.repository == 'majiayu000/blog' && github.ref == 'refs/heads/editorial/all-posts-natural-prose-20260920'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact source revision
        run: git archive --format=tar HEAD > /tmp/blog-editorial-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: blog-editorial-source
          path: /tmp/blog-editorial-source.tar
          retention-days: 1
