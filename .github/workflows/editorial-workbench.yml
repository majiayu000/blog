name: Apply and validate editorial review
on:
  push:
    branches: [editorial/all-posts-natural-prose-20260920]
    paths: [.github/workflows/editorial-workbench.yml]
permissions:
  contents: write
concurrency:
  group: editorial-all-posts-20260920
  cancel-in-progress: false
jobs:
  edit:
    if: github.repository == 'majiayu000/blog' && github.ref == 'refs/heads/editorial/all-posts-natural-prose-20260920'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply the individually reviewed text and validate protected bytes
        run: |
          set -euo pipefail
          python3 -m py_compile .editorial-workbench/apply.py
          python3 .editorial-workbench/apply.py
          git diff --check
      - name: Run repository tests and build
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test
          bun run build
      - name: Commit only the editorial scope on this branch
        env:
          EDITORIAL_BRANCH: editorial/all-posts-natural-prose-20260920
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$EDITORIAL_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          rm -rf .editorial-workbench
          rm .github/workflows/editorial-workbench.yml
          git add -- src/posts EDITORIAL_REVIEW.md .editorial-workbench .github/workflows/editorial-workbench.yml
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          for p in names:
              assert p == 'EDITORIAL_REVIEW.md' or p == '.github/workflows/editorial-workbench.yml' or p.startswith('.editorial-workbench/') or (p.startswith('src/posts/') and p.endswith('/index.html')), p
          assert sum(p.startswith('src/posts/') for p in names)==14, names
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Edit the remaining blog articles after a complete 19-post prose review' -m 'Preserve source evidence and working examples while removing drafting notes, repetitive framing and unsupported leaps. Keep Bun and Blender unchanged, retain PR #8, and record the decision for every post. Remove the temporary workbench after validation.'
          git push origin "HEAD:refs/heads/$EDITORIAL_BRANCH"
          git diff 7228c239fb8d3e9e207131e02da7c21d07aa7181 HEAD --stat > /tmp/editorial-diff-stat.txt
          git diff 7228c239fb8d3e9e207131e02da7c21d07aa7181 HEAD > /tmp/blog-editorial.patch
          git archive --format=tar HEAD > /tmp/blog-edited-source.tar
          git rev-parse HEAD > /tmp/editorial-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blog-editorial-reviewed
          path: |
            /tmp/blog-edited-source.tar
            /tmp/blog-editorial.patch
            /tmp/editorial-validation.json
            /tmp/editorial-diff-stat.txt
            /tmp/editorial-head.txt
          retention-days: 1
