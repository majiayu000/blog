name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Linux 文件系统大小写敏感，能跑到 macOS 上被 skip 的 slug 冲突用例
      - run: bun test
      - run: bun run build
