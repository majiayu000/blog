<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Computer History 采集管线：App 到 skysight Markdown">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141c"/>
      <stop offset="1" stop-color="#181e2a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#4fd1a5"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="720" fill="url(#bar)"/>

  <text x="56" y="78" fill="#8b93a4" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18" letter-spacing="3">CHATGPT.APP  ·  MACOS  ·  UNPACK</text>
  <text x="56" y="142" fill="#eef1f6" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="56" font-weight="700">Computer History</text>
  <text x="56" y="186" fill="#9aa4b4" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="22">设置页这个名字。包里另外还有两个。</text>

  <g filter="url(#soft)">
    <rect x="56" y="228" width="360" height="118" rx="16" fill="#1c2330" stroke="#7aa2ff" stroke-width="1.6"/>
    <text x="80" y="268" fill="#7aa2ff" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13">SETTINGS</text>
    <text x="80" y="308" fill="#eef1f6" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="28" font-weight="700">Computer History</text>
  </g>
  <g filter="url(#soft)">
    <rect x="460" y="228" width="360" height="118" rx="16" fill="#1c2330" stroke="#2a303c"/>
    <text x="484" y="268" fill="#8b93a4" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13">CONFIG / I18N</text>
    <text x="484" y="308" fill="#eef1f6" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="28" font-weight="700">chronicle</text>
  </g>
  <g filter="url(#soft)">
    <rect x="864" y="228" width="360" height="118" rx="16" fill="#1c2330" stroke="#4fd1a5" stroke-width="1.6"/>
    <text x="888" y="268" fill="#4fd1a5" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13">NATIVE FLAG / IPC</text>
    <text x="888" y="308" fill="#eef1f6" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="28" font-weight="700">skysight</text>
  </g>

  <!-- pipeline -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace">
    <rect x="56" y="410" width="200" height="88" rx="12" fill="#222836"/>
    <text x="156" y="448" text-anchor="middle" fill="#c3c9d6" font-size="15">App / Website</text>
    <text x="156" y="472" text-anchor="middle" fill="#8b93a4" font-size="12">AX · EventTap</text>
    <path d="M264 454 H292" stroke="#616a7c" stroke-width="2"/>
    <polygon points="292,448 304,454 292,460" fill="#616a7c"/>

    <rect x="312" y="410" width="220" height="88" rx="12" fill="#222836"/>
    <text x="422" y="448" text-anchor="middle" fill="#c3c9d6" font-size="15">events.jsonl</text>
    <text x="422" y="472" text-anchor="middle" fill="#8b93a4" font-size="12">ttl · 48h</text>
    <path d="M540 454 H568" stroke="#616a7c" stroke-width="2"/>
    <polygon points="568,448 580,454 568,460" fill="#616a7c"/>

    <rect x="588" y="410" width="220" height="88" rx="12" fill="#222836"/>
    <text x="698" y="448" text-anchor="middle" fill="#c3c9d6" font-size="15">codex exec</text>
    <text x="698" y="472" text-anchor="middle" fill="#8b93a4" font-size="12">SkysightSummarizer</text>
    <path d="M816 454 H844" stroke="#616a7c" stroke-width="2"/>
    <polygon points="844,448 856,454 844,460" fill="#616a7c"/>

    <rect x="864" y="410" width="360" height="88" rx="12" fill="#1a2a28" stroke="#4fd1a5" stroke-width="1.4"/>
    <text x="1044" y="448" text-anchor="middle" fill="#eef1f6" font-size="15">skysight/resources/*.md</text>
    <text x="1044" y="472" text-anchor="middle" fill="#8b93a4" font-size="12">10min  then  6h</text>
  </g>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13" fill="#8b93a4">
    <text x="56" y="560">window.changed</text>
    <text x="214" y="560">mouse.click</text>
    <text x="352" y="560">mouse.context_menu</text>
    <text x="538" y="560">mouse.drag</text>
    <text x="668" y="560">keyboard.text_input</text>
    <text x="868" y="560">keyboard.submit</text>
    <text x="1044" y="560">keyboard.shortcut</text>
    <text x="56" y="590">selection.changed</text>
    <text x="214" y="590">plaintext  ~/.codex/memories/extensions/skysight/</text>
  </g>

  <text x="56" y="668" fill="#616a7c" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14">from ChatGPT.app + SkyComputerUseService on this machine</text>
</svg>
